repo:
  name: "jackson-core"
  path: "../jackson-core-3.x"
  language: "java"
  source_root: "src/main/java"
  file_extensions: [".java"]
  exclude_patterns:
    - "*/test/*"
    - "*/tests/*"
    - "*/generated/*"
    - "*/module-info.java"
    - "*/package-info.java"
  max_file_lines: 2000
  min_file_lines: 10

llm:
  primary_provider: "gemini"
  secondary_provider: "gemini"
  temperature_range: [0.2, 0.8]
  max_output_tokens: 16384

scan:
  scans_per_principle: 12
  principles: ["SRP", "OCP", "LSP", "ISP", "DIP"]
  output_dir: "scans"
  reports_dir: "reports"
